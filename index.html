<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pharmaceutical Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F7F6;
    --surface: #FFFFFF;
    --ink: #1D2B30;
    --muted: #5B6B70;
    --line: #D9E2E0;
    --user: #E6EFED;
    --accent: #0E6E6A;
    --accent-soft: #E3F1EF;
    --amber: #9A6B12;
    --amber-soft: #FBF2DF;
    --danger: #A33A2F;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    font-size: 16px; line-height: 1.6; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* top bar */
  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 24px;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  .brand { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
  .mode { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .mode .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .mode.llm .dot { background: var(--accent); }
  .mode.offline .dot { background: var(--amber); }
  header .spacer { flex: 1; }
  .ghost {
    background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
    font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  .ghost:hover { background: var(--surface); }

  /* conversation */
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .thread { max-width: 860px; margin: 0 auto; padding: 32px 24px 24px; }
  .empty { padding: 12vh 0 0; }
  .empty h1 { font-size: 30px; line-height: 1.25; font-weight: 500; letter-spacing: -0.015em; margin: 0 0 12px; max-width: 30ch; }
  .empty p { color: var(--muted); margin: 0 0 24px; max-width: 60ch; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 10px; }
  .suggestion {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; cursor: pointer; text-align: left; font-size: 15px;
  }
  .suggestion:hover { border-color: var(--accent); }

  .msg { margin: 0 0 28px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--user); border-radius: 14px 14px 4px 14px; padding: 10px 16px;
    max-width: 75%; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .attach-note { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .msg.assistant .body { max-width: 72ch; overflow-wrap: anywhere; }
  .body p { margin: 0 0 12px; }
  .body ul { margin: 0 0 12px; padding-left: 22px; }
  .body li { margin: 2px 0; }
  .body li.sub { margin-left: 22px; list-style-type: circle; }
  .body code { font-family: var(--mono); font-size: 14px; background: var(--user); padding: 1px 5px; border-radius: 4px; }
  .notice { font-size: 14px; color: var(--amber); background: var(--amber-soft); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; }
  .error .body { color: var(--danger); }
  .actions { display: flex; gap: 8px; margin-top: 4px; }
  .actions button {
    background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 4px 6px; border-radius: 6px;
  }
  .actions button:hover { color: var(--ink); background: var(--user); }

  /* provenance seal: the one distinctive element */
  .seal {
    margin-top: 14px; border-left: 3px solid var(--accent); background: var(--surface);
    border-radius: 0 10px 10px 0; padding: 12px 16px; font-size: 14px; max-width: 72ch;
  }
  .seal.unverified { border-left-color: var(--danger); }
  .seal-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .seal-state { font-weight: 600; color: var(--accent); }
  .seal.unverified .seal-state { color: var(--danger); }
  .seal-hash { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border-radius: 999px; padding: 2px 10px; font-size: 13px; border: 1px solid var(--line); }
  .chip.met { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
  .chip.unmeasured { background: var(--amber-soft); border-color: transparent; color: var(--amber); }
  .chip.notmet { color: var(--ink); }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre.payload {
    font-family: var(--mono); font-size: 12px; line-height: 1.5; background: var(--bg); border-radius: 8px;
    padding: 12px; max-height: 360px; overflow: auto; white-space: pre; margin: 8px 0 0;
  }

  .thinking { color: var(--muted); font-size: 15px; }
  .thinking::after { content: "…"; }

  /* composer */
  footer { padding: 12px 24px 20px; background: var(--bg); }
  .composer {
    max-width: 860px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 10px 10px 10px 14px;
  }
  .composer:focus-within { border-color: var(--accent); }
  .file-chip {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px; background: var(--accent-soft);
    color: var(--accent); border-radius: 8px; padding: 3px 4px 3px 10px; margin: 0 0 8px;
  }
  .file-chip button { background: none; border: none; cursor: pointer; color: inherit; padding: 0 6px; font-size: 15px; }
  .row { display: flex; align-items: flex-end; gap: 8px; }
  textarea {
    flex: 1; border: none; resize: none; outline: none; font: inherit; color: inherit; background: transparent;
    max-height: 220px; min-height: 28px; padding: 6px 0; line-height: 1.5;
  }
  textarea:focus-visible { outline: none; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: none; cursor: pointer; display: grid; place-items: center;
    background: none; color: var(--muted); flex: none;
  }
  .icon-btn:hover { background: var(--user); color: var(--ink); }
  .send { background: var(--accent); color: #fff; }
  .send:hover { background: #0B5C58; color: #fff; }
  .send:disabled { background: var(--line); cursor: default; }
  .fine { max-width: 860px; margin: 8px auto 0; font-size: 12px; color: var(--muted); text-align: center; }

  @media (max-width: 640px) {
    header, footer { padding-left: 14px; padding-right: 14px; }
    .thread { padding: 20px 14px; }
    .mode span.label { display: none; }
    .brand { font-size: 16px; }
    header { gap: 10px; }
    .msg.user .bubble { max-width: 88%; }
    .empty h1 { font-size: 25px; }
  }
  @media (prefers-reduced-motion: reduce) { main { scroll-behavior: auto; } }
</style>
</head>
<body>
<header>
  <span class="brand">Pharmaceutical Ledger</span>
  <span class="mode" id="mode"><span class="dot"></span><span class="label" id="modeLabel">Connecting</span></span>
  <span class="spacer"></span>
  <button class="ghost" id="newChat" type="button">New chat</button>
</header>

<main id="scroller">
  <div class="thread" id="thread" aria-live="polite">
    <section class="empty" id="empty">
      <h1>Ask about a therapeutic target</h1>
      <p>Each answer comes from a sealed run of the axiomatic ledger. Your browser checks the seal, and the answer
         says plainly what the ledger did not establish.</p>
      <div class="suggestions">
        <button class="suggestion" type="button">Run the ledger for TREM2 in Alzheimer's disease</button>
        <button class="suggestion" type="button">Run the ledger for Duchenne muscular dystrophy</button>
      </div>
    </section>
  </div>
</main>

<footer>
  <form class="composer" id="composer">
    <div id="fileSlot"></div>
    <div class="row">
      <button class="icon-btn" id="attach" type="button" aria-label="Upload a target definition (.json)" title="Upload a target definition (.json)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
      </button>
      <input type="file" id="file" accept=".json,application/json" hidden>
      <textarea id="input" rows="1" placeholder="Ask about a target, or follow up on the last result" aria-label="Message"></textarea>
      <button class="icon-btn send" id="send" type="submit" aria-label="Send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
  <p class="fine">Research prototype. Results are not medical advice.</p>
</footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const thread = $("thread"), input = $("input"), send = $("send"), scroller = $("scroller");
  let messages = [];          // conversation sent to the server: {role, content}
  let payload = null;         // latest sealed payload: {canonical, seal}
  let uploaded = null;        // pending target definition from an uploaded file
  let busy = false;

  // ---------- status
  fetch("/api/status").then(r => r.json()).then(s => {
    const m = $("mode");
    m.classList.add(s.front_end);
    $("modeLabel").textContent = s.front_end === "llm" ? `AI front end (${s.model})` : "Built-in renderer";
  }).catch(() => { $("modeLabel").textContent = "Server unreachable"; });

  // ---------- rendering
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  function inline(t) {
    return esc(t)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|\s)_([^_]+)_(?=\s|$)/g, "$1<em>$2</em>");
  }
  function markdown(text) {
    const out = []; let list = null;
    for (const raw of text.split("\n")) {
      const line = raw.trimEnd();
      const item = line.match(/^(\s*)[-*]\s+(.*)$/);
      if (item) {
        if (!list) { list = []; }
        list.push(`<li${item[1].length >= 2 ? ' class="sub"' : ""}>${inline(item[2])}</li>`);
        continue;
      }
      if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; }
      if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    }
    if (list) out.push(`<ul>${list.join("")}</ul>`);
    return out.join("");
  }

  async function sha256Hex(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  const CRITERIA_NAMES = {
    natural_emergence: "Natural emergence", compton_safety: "Compton-class safety",
    performance_velocity: "Performance velocity", cognitive_transparency: "Cognitive transparency"
  };

  async function sealElement(p, verdict) {
    const el = document.createElement("div");
    el.className = "seal";
    let ok = false;
    try { ok = (await sha256Hex(p.canonical)) === p.seal.sha256; } catch (e) { ok = false; }
    if (!ok) el.classList.add("unverified");
    const chips = Object.entries(verdict.criteria).map(([k, v]) => {
      const cls = v === "met" ? "met" : v === "not measured" ? "unmeasured" : "notmet";
      return `<span class="chip ${cls}">${esc(CRITERIA_NAMES[k] || k)}: ${esc(v)}</span>`;
    }).join("");
    let pretty = "";
    try { pretty = JSON.stringify(JSON.parse(p.canonical), null, 2); } catch (e) { pretty = p.canonical; }
    el.innerHTML = `
      <div class="seal-head">
        <span class="seal-state">${ok ? "Sealed ledger payload, verified in your browser" : "Seal check failed: do not rely on this answer"}</span>
        <span class="seal-hash" title="${esc(p.seal.sha256)}">SHA-256 ${esc(p.seal.sha256.slice(0, 16))}…</span>
      </div>
      <div class="chips">${chips}<span class="chip">${verdict.not_established} items not established</span></div>
      ${verdict.assessment ? `<div class="chips">
        <span class="chip">Confidence α ${verdict.assessment.confidence.toFixed(3)}</span>
        <span class="chip">Λ strict ${verdict.assessment.lambda_strict.toFixed(3)}</span>
        <span class="chip ${verdict.assessment.risk.high ? "unmeasured" : ""}">Risk flags ${verdict.assessment.risk.high} high, ${verdict.assessment.risk.medium} medium, ${verdict.assessment.risk.low} low</span>
      </div>` : ""}
      <details><summary>View payload</summary><pre class="payload"></pre></details>`;
    el.querySelector("pre").textContent = pretty;
    return el;
  }

  function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }

  function addUser(text, fileName) {
    $("empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg user";
    el.innerHTML = `<div class="bubble"></div>`;
    el.querySelector(".bubble").textContent = text;
    if (fileName) {
      const n = document.createElement("span");
      n.className = "attach-note"; n.textContent = `Target: ${fileName}`;
      el.querySelector(".bubble").appendChild(n);
    }
    thread.appendChild(el); scrollDown();
  }

  function addThinking() {
    const el = document.createElement("div");
    el.className = "msg assistant";
    el.innerHTML = `<div class="thinking">Running the ledger</div>`;
    thread.appendChild(el); scrollDown();
    return el;
  }

  async function fillAssistant(el, res) {
    el.innerHTML = "";
    if (res.error) el.classList.add("error");
    if (res.notice) {
      const n = document.createElement("div"); n.className = "notice"; n.textContent = res.notice; el.appendChild(n);
    }
    const body = document.createElement("div");
    body.className = "body"; body.innerHTML = markdown(res.reply || "");
    el.appendChild(body);
    if (res.payload && res.verdict) el.appendChild(await sealElement(res.payload, res.verdict));
    const actions = document.createElement("div");
    actions.className = "actions";
    const copy = document.createElement("button");
    copy.type = "button"; copy.textContent = "Copy";
    copy.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(res.reply || ""); copy.textContent = "Copied"; }
      catch (e) { copy.textContent = "Copy failed"; }
      setTimeout(() => (copy.textContent = "Copy"), 1600);
    });
    actions.appendChild(copy);
    el.appendChild(actions);
    scrollDown();
  }

  // ---------- sending
  async function submit(text) {
    text = text.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true;
    const file = uploaded;
    addUser(text, file?.name);
    messages.push({ role: "user", content: text });
    input.value = ""; resize(); clearFile();
    const pending = addThinking();
    try {
      const r = await fetch("/api/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, payload, target: file?.target || null })
      });
      const res = await r.json();
      if (!r.ok) throw new Error(res.error || `HTTP ${r.status}`);
      if (res.payload) payload = res.payload;
      messages.push({ role: "assistant", content: res.reply || "" });
      await fillAssistant(pending, res);
    } catch (e) {
      await fillAssistant(pending, { reply: `The request failed: ${e.message}. Check that app.py is running, then try again.`, error: true });
      messages.pop();
    } finally {
      busy = false; send.disabled = !input.value.trim();
    }
  }

  $("composer").addEventListener("submit", (e) => { e.preventDefault(); submit(input.value); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(input.value); }
  });
  function resize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 220) + "px"; }
  input.addEventListener("input", () => { resize(); send.disabled = busy || !input.value.trim(); });
  document.querySelectorAll(".suggestion").forEach(b => b.addEventListener("click", () => submit(b.textContent)));

  // ---------- upload a target definition
  $("attach").addEventListener("click", () => $("file").click());
  $("file").addEventListener("change", async (e) => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    try {
      const target = JSON.parse(await f.text());
      uploaded = { name: f.name, target };
      $("fileSlot").innerHTML = `<span class="file-chip"><span></span><button type="button" aria-label="Remove file">×</button></span>`;
      $("fileSlot").querySelector("span span").textContent = `Target: ${f.name}`;
      $("fileSlot").querySelector("button").addEventListener("click", clearFile);
      if (!input.value.trim()) { input.value = "Run the ledger for this target"; send.disabled = false; }
      input.focus();
    } catch (err) {
      $("fileSlot").innerHTML = "";
      alert(`${f.name} is not valid JSON, so it was not attached.`);
    }
  });
  function clearFile() { uploaded = null; $("fileSlot").innerHTML = ""; }

  // ---------- new chat
  $("newChat").addEventListener("click", () => location.reload());
  input.focus();
})();
</script>
</body>
</html>
